<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7B Bot</title>

<style>
body {
    margin: 0;
    background: #0d1117;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    background: #161b22;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(0,255,255,0.15);
}

.banner {
    height: 250px;
    background: url('IMG_1672.jpeg') center/cover no-repeat;
    position: relative;
}

.profile-pic {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 5px solid #161b22;
    background: url('IMG_1670.jpeg') center/cover no-repeat;
    position: absolute;
    bottom: -70px;
    left: 40px;
}

.content {
    padding: 90px 40px 40px;
}

h1 {
    margin-bottom: 5px;
    font-size: 2.5rem;
}

.subtitle {
    color: #00d9ff;
    margin-bottom: 20px;
}

.info-box {
    background: #21262d;
    padding: 20px;
    border-radius: 15px;
    margin-top: 20px;
}

.button {
    display: inline-block;
    margin-top: 25px;
    padding: 14px 28px;
    background: linear-gradient(45deg, #00d9ff, #0066ff);
    border-radius: 12px;
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

.button:hover {
    transform: scale(1.05);
}

footer {
    text-align: center;
    padding: 20px;
    color: #8b949e;
}
</style>
</head>
<body>

<div class="container">
    <div class="banner">
        <div class="profile-pic"></div>
    </div>

    <div class="content">
        <h1>7B Bot</h1>
        <p class="subtitle">Discord Utility & Giveaway Bot</p>

        <div class="info-box">
            <h2>About</h2>
            <p>
                7B Bot is built to make Discord servers cleaner, faster,
                and more fun with giveaways, moderation, utility commands,
                and stylish features.
            </p>
        </div>

        <div class="info-box">
            <h2>Bot Details</h2>
            <p>Prefix: /</p>
            <p>Status: Online 🟢</p>
            <p>Version: 1.0.0</p>
        </div>

        <a href="https://discord.gg/Q65BXT4MhG" class="button">Join My Server</a>
    </div>

    <footer>
        © 2026 7B Bot
    </footer>
</div>

</body>
</html>
